<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>LAN Portal — Experimental Control</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08090a;color:#f2f3f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#08090a}button,input,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible,input:focus-visible+.track{outline:2px solid #fff;outline-offset:5px}button:disabled{cursor:default}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.board{width:min(100%,1080px);margin:auto;padding:clamp(18px,4vw,48px);padding-bottom:calc(108px + env(safe-area-inset-bottom));min-height:100svh;display:flex;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2.8vw,30px);width:100%}.card{aspect-ratio:1;border:1px solid #242629;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 40% 20%,#17191c 0,#111316 70%);min-width:0;isolation:isolate}.reading{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:100%;padding:0;font-variant-numeric:tabular-nums}.number{position:relative;display:inline-flex;align-items:center;justify-content:center;font-size:clamp(46px,6.3vw,70px);font-weight:350;line-height:1;letter-spacing:-2px;white-space:nowrap;text-align:center}.number:after{content:'\00b0';display:inline-block;align-self:flex-start;margin-left:2px;margin-top:.1em;font-size:.45em;color:#8c9097;letter-spacing:0}.number.unavailable:after{content:''}.step{display:none;align-items:center;justify-content:center;width:52px;height:52px;min-width:52px;border-radius:50%;padding:0;background:transparent;font-size:30px;font-weight:300;line-height:1;transition:background .14s,opacity .14s}.step:active:not(:disabled){background:#ffffff12}.step:disabled{opacity:.16}.editing .step{display:flex}.editing .number{font-size:clamp(30px,4.3vw,48px);min-width:2.15em;letter-spacing:-1.3px}.editing .number:after{font-size:.4em;margin-top:.08em}.controller .status-word{font-family:"Arial Black",system-ui,sans-serif;font-size:clamp(30px,4.5vw,46px);font-weight:900;letter-spacing:.045em;line-height:1;color:#555960;transition:color .2s}.controller.online .status-word{color:#67c58a}.controller.failed .status-word{color:#b17878}.controller.busy .status-word{color:#898b90}.dock{position:fixed;z-index:3;bottom:calc(22px + env(safe-area-inset-bottom));right:max(24px,calc((100vw - 984px)/2));display:flex;gap:22px;align-items:center;padding:7px 8px 7px 14px;border-radius:40px;background:#08090ae8;backdrop-filter:blur(15px)}.refresh{display:grid;place-items:center;width:48px;height:48px;padding:11px;border-radius:50%;background:transparent;color:#d8dadd}.refresh svg{width:25px;height:25px}.refresh:active{background:#ffffff0b}.refresh:disabled{opacity:.55}.refresh.failed{color:#c58c8c}.refresh.spinning svg{animation:rotate 1.4s linear infinite}.control{position:relative;display:block;width:60px;height:44px;padding:5px 0;cursor:pointer}.control input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.track{display:block;width:60px;height:34px;border-radius:25px;border:1px solid #41444a;background:#191b1f;pointer-events:none;transition:background .18s}.track:after{content:'';display:block;width:26px;height:26px;border-radius:50%;background:#969ba3;margin:3px;transition:transform .18s,background .18s}.control input:checked+.track{background:#ededee;border-color:#ededee}.control input:checked+.track:after{transform:translateX(26px);background:#17191c}.control input:disabled+.track{opacity:.35}.control input:disabled{cursor:default}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.toast{position:fixed;z-index:4;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#25272b;border:1px solid #373a40;color:#d4d7db;border-radius:30px;padding:10px 18px;font-size:12px;text-align:center;max-width:90vw}.toast:empty{display:none}body:not(.loaded) .board,body:not(.loaded) .control,body:not(.loaded) .toast{display:none}body:not(.loaded) .dock{inset:50% auto auto 50%;transform:translate(-50%,-50%);padding:0;background:none}body:not(.loaded) .refresh{width:88px;height:88px;padding:25px}body:not(.loaded) .refresh svg{width:35px;height:35px}body.loading .reading{opacity:.55}@keyframes rotate{to{transform:rotate(360deg)}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.board{padding:20px 18px calc(98px + env(safe-area-inset-bottom));align-items:flex-start}.step{width:44px;min-width:44px;height:44px;font-size:28px}.editing .number{font-size:30px;min-width:2.04em;letter-spacing:-1px}.dock{right:17px;bottom:calc(14px + env(safe-area-inset-bottom));gap:18px}.number{font-size:52px}}@media(min-width:651px) and (max-width:900px){.board{padding:28px 22px 106px}.cards{gap:18px}.step{width:44px;min-width:44px;height:44px}.editing .number{font-size:32px}.number{font-size:54px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}.refresh.spinning svg{animation:none}}
.room-heading{position:absolute;top:17%;left:14%;width:72%;text-align:center}.room-heading h3{margin:0;font-size:clamp(12px,1.6vw,17px);line-height:1.2;font-weight:500;letter-spacing:.01em;color:#a2a6ad;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@media(max-width:650px){.room-heading h3{font-size:13px}.room-heading{top:17%;left:15%;width:70%}}
.notice{position:fixed;top:8px;left:0;width:100%;margin:0;padding:0 12px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#a2a6ad;z-index:2}.board{padding-top:54px}</style></head><body>
<p class="notice">Unofficial · Experimental control · Use at your own risk · No warranty</p><main class="board" aria-label="Room temperatures"><div id="cards" class="cards"></div></main>
<div class="dock"><button id="refresh" class="refresh" type="button" aria-label="Refresh temperatures"></button><label class="control"><input id="control" type="checkbox" role="switch" aria-label="Enable temperature control" disabled><span class="track" aria-hidden="true"></span></label></div>
<div id="toast" class="toast" aria-hidden="true"></div><div id="announce" class="sr-only" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const globals=['isMaster','numberOfSlaveControllers','totalNumberOfDevices'];
const fields=['deviceType','kurzID','ownerKurzID','name','RaumTemp','SollTemp','TempSIUnit','SollTempMinVal','SollTempMaxVal'];
const integer=value=>typeof value==='string'&&/^[+-]?\d{1,6}$/.test(value.trim())?Number(value.trim()):null;
const unit=value=>({0:'C',1:'F'})[integer(value)]||null;
const validRaw=value=>{const n=integer(value);return n!==null&&n>=-32768&&n<=32767?n:null;};
let state=null,busy=false,valid=false,health=false,toastTimer;
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function icon(){const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('viewBox','0 0 32 32');e.setAttribute('aria-hidden','true');['M25 11a10 10 0 1 0 1 9','M25 5v7h-7'].forEach(d=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);e.append(p);});return e;}
function message(text){$('announce').textContent=text;clearTimeout(toastTimer);$('toast').textContent=text;toastTimer=setTimeout(()=>{$('toast').textContent='';},4500);}
function lock(value){busy=value;document.body.classList.toggle('loading',value);$('refresh').disabled=value;$('refresh').classList.toggle('spinning',value);$('control').disabled=value||!valid||!state||!state.rooms.some(canControl);render();}
  async function request(path, options) {
    const abort = new AbortController();
    const timeout = setTimeout(() => abort.abort(), 180000);
    try {
      const response = await fetch(path, Object.assign({cache: 'no-store', credentials: 'same-origin', redirect: 'error', signal: abort.signal}, options));
      if (!response.ok) throw new Error('Controller HTTP status ' + response.status);
      const bytes = new Uint8Array(await response.arrayBuffer());
      if (bytes.length > 262144) throw new Error('Controller reply exceeds the size limit');
      const header = (response.headers.get('content-type') || '').match(/charset\s*=\s*["']?([\w-]+)/i);
      const prefix = new TextDecoder('windows-1252').decode(bytes.slice(0, 200));
      const declaration = prefix.match(/<\?xml[^>]*encoding\s*=\s*["']([\w-]+)["']/i);
      const encoding = header ? header[1] : declaration ? declaration[1] : null;
      if (encoding) {
        if (!/^(utf-8|utf8|iso-8859-1|windows-1252|us-ascii)$/i.test(encoding)) throw new Error('Unsupported controller text encoding');
        return new TextDecoder(encoding, {fatal: true}).decode(bytes);
      }
      try { return new TextDecoder('utf-8', {fatal: true}).decode(bytes); }
      catch (error) { return new TextDecoder('windows-1252').decode(bytes); }
    } finally { clearTimeout(timeout); }
  }
  async function liveRead(names) {
    const values = {};
    for (let offset = 0; offset < names.length; offset += 32) {
      const batch = names.slice(offset, offset + 32);
      if (batch.some(n => !/^[A-Za-z][A-Za-z0-9_.-]{0,30}$/.test(n)) || new Set(batch).size !== batch.length) throw new Error('Invalid read identifiers');
      const body = '<body><version>1.0</version><item_list_size>' + batch.length + '</item_list_size><item_list>' + batch.map(n => '<i><n>' + n + '</n></i>').join('') + '</item_list></body>';
      const text = await request('/cgi-bin/ILRReadValues.cgi', {method: 'POST', headers: {'Content-Type': 'text/xml'}, body});
      if (/<!DOCTYPE|<!ENTITY|\u0000/i.test(text)) throw new Error('Unsupported XML response');
      const doc = new DOMParser().parseFromString(text, 'application/xml');
      if (doc.querySelector('parsererror') || doc.documentElement.tagName !== 'body') throw new Error('Invalid controller XML');
      const direct = (parent, tag) => Array.from(parent.children).filter(n => n.tagName === tag);
      const root = doc.documentElement, versions = direct(root, 'version'), sizes = direct(root, 'item_list_size'), lists = direct(root, 'item_list');
      if (versions.length !== 1 || versions[0].textContent !== '1.0' || sizes.length !== 1 || lists.length !== 1 || integer(sizes[0].textContent) !== lists[0].children.length) throw new Error('Invalid XML envelope');
      batch.forEach(n => { values[n] = null; });
      const seen = new Set();
      for (const item of lists[0].children) {
        const keys = direct(item, 'n'), entries = direct(item, 'v');
        if (item.tagName !== 'i' || keys.length !== 1 || entries.length > 1 || keys[0].children.length || (entries[0] && entries[0].children.length)) throw new Error('Ambiguous XML record');
        const key = keys[0].textContent;
        if (!batch.includes(key) || seen.has(key)) throw new Error('Unexpected or duplicate reply key');
        seen.add(key); values[key] = entries.length ? entries[0].textContent : null;
      }
    }
    return values;
  }

const transport={read:liveRead,write:async(name,value)=>{await request('/cgi-bin/writeVal.cgi?'+name+'='+encodeURIComponent(String(value)),{method:'GET'});}};
function canControl(room){if(!valid)return false;const d=room.data,c=room.controller;return integer(d.deviceType)===3&&/^[0-9a-f]{24}$/i.test(c.id||'')&&integer(d.kurzID)!==null&&integer(d.kurzID)>=0&&integer(d.kurzID)<=255&&integer(d.ownerKurzID)!==null&&integer(d.ownerKurzID)===integer(c.shortId)&&unit(d.TempSIUnit)!==null&&validRaw(d.RaumTemp)!==null&&validRaw(d.SollTemp)!==null&&validRaw(d.SollTempMinVal)!==null&&validRaw(d.SollTempMaxVal)!==null&&integer(d.SollTempMinVal)<=integer(d.SollTempMaxVal)&&!(c.index===0&&integer(c.status)===3);}
function step(raw,direction){return direction>0?Math.floor(raw/50)*50+50:Math.ceil(raw/50)*50-50;}
function render(){
 $('cards').replaceChildren();if(!state)return;
 const editing=$('control').checked&&valid;document.body.classList.toggle('editing',editing);
 state.rooms.forEach((room,index)=>{
  const d=room.data,name=d.name||'Room '+(index+1),scale=unit(d.TempSIUnit),raw=valid?validRaw(editing?d.SollTemp:d.RaumTemp):null;
  const card=element('article',undefined,'card room');card.setAttribute('aria-label',name);const heading=element('div',undefined,'room-heading');heading.append(element('h3',name));card.append(heading);
  const reading=element('div',undefined,'reading'),minus=element('button','\u2212','step minus'),plus=element('button','+','step plus'),number=element('span',raw===null||!scale?'\u2014':(raw/100).toFixed(1),'number'+(raw===null||!scale?' unavailable':''));
  number.setAttribute('aria-label',(editing?'Target':'Measured')+' temperature for '+name+': '+(raw===null||!scale?'unavailable':(raw/100).toFixed(1)+' degrees '+scale));
  minus.type=plus.type='button';minus.setAttribute('aria-label','Decrease target for '+name);plus.setAttribute('aria-label','Increase target for '+name);
  const target=validRaw(d.SollTemp),allowed=editing&&canControl(room)&&!busy;
  minus.disabled=!allowed||target===null||step(target,-1)<integer(d.SollTempMinVal);plus.disabled=!allowed||target===null||step(target,1)>integer(d.SollTempMaxVal);
  minus.addEventListener('click',()=>adjust(room,-1));plus.addEventListener('click',()=>adjust(room,1));reading.append(minus,number,plus);card.append(reading);$('cards').append(card);
 });
 state.controllers.forEach(c=>{
  const card=element('article',undefined,'card controller '+(busy?'busy':health?'online':'failed'));
  card.setAttribute('aria-label','Controller '+(c.index+1)+': '+(busy?'refreshing':health?'refresh successful':'refresh failed'));
  const status=element('div','LAN','status-word');card.append(status);$('cards').append(card);
 });
}
async function refresh(){
 if(busy)return;$('control').checked=false;health=false;$('refresh').classList.remove('failed');$('toast').textContent='';lock(true);$('announce').textContent='Refreshing';
 try{
  const first=await transport.read(globals),slaves=integer(first.numberOfSlaveControllers),total=integer(first.totalNumberOfDevices);
  if(![0,1].includes(integer(first.isMaster))||slaves===null||slaves<0||slaves>=16||total===null||total<0||total>256)throw new Error('No readings');
  const names=[];for(let i=0;i<=slaves;i++)['numberOfPairedDevices','uniqueID','kurzID','name','SystemStatus'].forEach(f=>names.push('R'+i+'.'+f));
  const metadata=await transport.read(names),controllers=[];
  for(let i=0;i<=slaves;i++){const p='R'+i+'.',count=integer(metadata[p+'numberOfPairedDevices']);if(count===null||count<0||count>256)throw new Error('No readings');controllers.push({index:i,count,id:metadata[p+'uniqueID'],shortId:metadata[p+'kurzID'],status:metadata[p+'SystemStatus']});}
  if(controllers.reduce((n,c)=>n+c.count,0)!==total)throw new Error('Refresh failed');
  const queries=[];controllers.forEach(c=>{for(let i=0;i<c.count;i++)fields.forEach(f=>queries.push('R'+c.index+'.G'+i+'.'+f));});
  const values=await transport.read(queries),rooms=[];
  controllers.forEach(c=>{for(let i=0;i<c.count;i++){const prefix='R'+c.index+'.G'+i,data={};fields.forEach(f=>{data[f]=values[prefix+'.'+f];});if(integer(data.deviceType)===3)rooms.push({prefix,controller:c,data});}});
  const keys=globals.concat(controllers.flatMap(c=>['R'+c.index+'.uniqueID','R'+c.index+'.numberOfPairedDevices'])).concat(rooms.map(r=>r.prefix+'.kurzID'));
  const confirmed=await transport.read(keys);
  if(globals.some(k=>confirmed[k]!==first[k])||controllers.some(c=>confirmed['R'+c.index+'.uniqueID']!==c.id||integer(confirmed['R'+c.index+'.numberOfPairedDevices'])!==c.count)||rooms.some(r=>confirmed[r.prefix+'.kurzID']!==r.data.kurzID))throw new Error('Refresh again');
  if(!rooms.some(r=>validRaw(r.data.RaumTemp)!==null&&unit(r.data.TempSIUnit)))throw new Error('No readings');
  state={first,controllers,rooms};valid=true;health=true;document.body.classList.add('loaded');$('announce').textContent='Readings refreshed';
 }catch(error){valid=false;health=false;$('refresh').classList.add('failed');message(error.name==='AbortError'?'Refresh timed out':['No readings','Refresh again'].includes(error.message)?error.message:'Refresh failed');}
 finally{lock(false);}
}
async function adjust(room,direction){
 if(busy||!$('control').checked||!canControl(room))return;lock(true);let sent=false;
 try{
  const p=room.prefix+'.',c='R'+room.controller.index+'.';
  const check=await transport.read(globals.concat([c+'uniqueID',c+'numberOfPairedDevices',c+'SystemStatus',c+'kurzID',p+'deviceType',p+'kurzID',p+'ownerKurzID',p+'RaumTemp',p+'SollTemp',p+'TempSIUnit',p+'SollTempMinVal',p+'SollTempMaxVal']));
  if(globals.some(k=>check[k]!==state.first[k])||check[c+'uniqueID']!==room.controller.id||integer(check[c+'numberOfPairedDevices'])!==room.controller.count||check[p+'kurzID']!==room.data.kurzID||check[p+'ownerKurzID']!==room.data.ownerKurzID||integer(check[p+'ownerKurzID'])!==integer(check[c+'kurzID'])||check[p+'TempSIUnit']!==room.data.TempSIUnit||integer(check[p+'deviceType'])!==3||validRaw(check[p+'RaumTemp'])===null||(room.controller.index===0&&integer(check[c+'SystemStatus'])===3))throw new Error('Refresh again');
  const current=validRaw(check[p+'SollTemp']);if(current===null)throw new Error('Refresh again');
  if(current!==validRaw(room.data.SollTemp)){room.data.SollTemp=check[p+'SollTemp'];throw new Error('Target changed. Tap again.');}
  const next=step(current,direction),min=validRaw(check[p+'SollTempMinVal']),max=validRaw(check[p+'SollTempMaxVal']);
  if(min===null||max===null||min>max||next<min||next>max)throw new Error('Limit reached');
  sent=true;await transport.write(p+'SollTemp',next);
  const result=await transport.read([c+'uniqueID',p+'kurzID',p+'TempSIUnit',p+'SollTemp']);
  if(result[c+'uniqueID']!==room.controller.id||result[p+'kurzID']!==room.data.kurzID||result[p+'TempSIUnit']!==room.data.TempSIUnit||integer(result[p+'SollTemp'])!==next)throw new Error('Not confirmed. Refresh.');
  room.data.SollTemp=result[p+'SollTemp'];$('announce').textContent='Target '+(next/100).toFixed(1)+' degrees';
 }catch(error){if(sent){valid=false;health=false;$('control').checked=false;}message(sent?'Not confirmed. Refresh.':['Refresh again','Target changed. Tap again.','Limit reached'].includes(error.message)?error.message:'Not changed');}
 finally{lock(false);}
}
$('refresh').append(icon('refresh'));$('refresh').addEventListener('click',refresh);$('control').addEventListener('change',()=>{document.body.classList.toggle('editing',$('control').checked);render();});

}());
</script></body></html>
